<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Messenger</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #efeae2;
      color: #111b21;
    }

    .app {
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    .sidebar {
      width: 100%;
      max-width: 430px;
      background: white;
      display: flex;
      flex-direction: column;
    }

    .header {
      height: 65px;
      padding: 0 18px;
      background: #f0f2f5;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header h1 {
      margin: 0;
      font-size: 22px;
    }

    .icons {
      display: flex;
      gap: 18px;
      font-size: 22px;
    }

    .search {
      margin: 10px 14px;
      height: 42px;
      background: #f0f2f5;
      border-radius: 10px;
      display: flex;
      align-items: center;
      padding: 0 15px;
      gap: 10px;
    }

    .search input {
      border: 0;
      outline: 0;
      background: transparent;
      width: 100%;
      font-size: 15px;
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid #ddd;
    }

    .tabs button {
      flex: 1;
      border: 0;
      background: white;
      padding: 13px 5px;
      font-weight: bold;
      color: #667781;
    }

    .tabs button.active {
      color: #008069;
      border-bottom: 3px solid #008069;
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
    }

    .chat {
      height: 75px;
      padding: 10px 15px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #f0f2f5;
    }

    .chat:hover {
      background: #f5f6f6;
    }

    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #dfe5e7;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
    }

    .chat-info {
      flex: 1;
    }

    .chat-top {
      display: flex;
      justify-content: space-between;
    }

    .chat-name {
      font-weight: bold;
    }

    .time {
      font-size: 12px;
      color: #667781;
    }

    .message {
      margin-top: 6px;
      color: #667781;
      font-size: 14px;
    }

    .unread {
      background: #25d366;
      color: white;
      border-radius: 50%;
      min-width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }

    .bottom {
      padding: 12px;
      border-top: 1px solid #eee;
      display: flex;
      justify-content: space-around;
      color: #54656f;
    }

        justify-content: center;
      }
